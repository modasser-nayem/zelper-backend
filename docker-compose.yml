version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zelper-api
    image: zelper-api:latest
    ports:
      - "5014:5014"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5014
    volumes:
      - ./logs:/usr/src/app/logs
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: zelper-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: zelper
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zelper"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
